<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تواصل معنا | استشارات البناء الرشيق</title>
    <style>
        @import url('https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css');
        body { font-family: 'Vazirmatn', sans-serif; margin: 0; background: #f8fafc; color: #1e293b; line-height: 1.8; }
        header { background: #fff; border-bottom: 1px solid #e2e8f0; padding: 15px 5%; display: flex; justify-content: space-between; align-items: center; }
        .contact-box { background: #fff; padding: 40px; margin: 50px auto; max-width: 600px; border-radius: 8px; border: 1px solid #e2e8f0; box-shadow: 0 4px 6px rgba(0,0,0,0.02); }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: 600; color: #0f172a; }
        .form-group input, .form-group textarea { width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 6px; box-sizing: border-box; font-family: inherit; }
        button { background: #2563eb; color: #fff; border: none; padding: 14px 28px; border-radius: 6px; font-weight: 600; cursor: pointer; width: 100%; font-family: 'Vazirmatn'; }
        button:hover { background: #1d4ed8; }
        footer { background: #0f172a; color: #94a3b8; text-align: center; padding: 30px; margin-top: 60px; }
    </style>
</head>
<body>
    <header>
        <a href="/ar/index.html" style="font-weight:700; text-decoration:none; color:#0f172a; font-size:20px;">حلول <span style="color:#2563eb;">البناء الرشيق</span></a>
        <nav style="display:flex; gap:20px;">
            <a href="/ar/index.html" style="text-decoration:none; color:#475569;">الرئيسية</a>
            <a href="/ar/services.html" style="text-decoration:none; color:#475569;">الخدمات</a>
            <a href="/ar/resume.html" style="text-decoration:none; color:#475569;">السيرة الذاتية للمستشار</a>
            <a href="/ar/contact.html" style="text-decoration:none; color:#2563eb; font-weight:bold;">تواصل معنا</a>
        </nav>
    </header>

    <div class="contact-box">
        <h1 style="margin-top:0; color:#0f172a;">تواصل معنا لطلب الاستشارات</h1>
        <p style="color:#64748b; margin-bottom:30px;">نسعد بتلقي استفساراتكم حول تطوير المشاريع الإنشائية وتطبيق مبادئ البناء الرشيق في دول الخليج.</p>
        
        <form action="#" method="POST">
            <div class="form-group">
                <label>الاسم الكامل</label>
                <input type="text" placeholder="أدخل اسمك الكريم" required>
            </div>
            <div class="form-group">
                <label>البريد الإلكتروني</label>
                <input type="email" placeholder="name@company.com" required>
            </div>
            <div class="form-group">
                <label>اسم الشركة أو المشروع</label>
                <input type="text" placeholder="اسم جهة العمل">
            </div>
            <div class="form-group">
                <label>تفاصيل الاستفسار</label>
                <textarea rows="5" placeholder="اكتب تفاصيل ومواصفات مشروعك هنا..."></textarea>
            </div>
            <button type="submit">إرسال الطلب</button>
        </form>
    </div>

    <footer>
        <p>&copy; 2026 خدمات استشارات البناء الرشيق. جميع الحقوق محفوظة.</p>
    </footer>
</body>
</html>
