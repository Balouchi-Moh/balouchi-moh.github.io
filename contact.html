<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | Lean Construction Advisory</title>
    <link rel="stylesheet" href="/css/style.css">
    <style>
        body { font-family: 'Space Grotesk', sans-serif; margin: 0; background: #f8fafc; color: #1e293b; line-height: 1.6; }
        header { background: #fff; border-bottom: 1px solid #e2e8f0; padding: 15px 5%; display: flex; justify-content: space-between; align-items: center; }
        .contact-box { background: #fff; padding: 40px; margin: 50px auto; max-width: 600px; border-radius: 8px; border: 1px solid #e2e8f0; box-shadow: 0 4px 6px rgba(0,0,0,0.02); }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: 600; color: #0f172a; }
        .form-group input, .form-group textarea { width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 6px; box-sizing: border-box; font-family: inherit; }
        button { background: #2563eb; color: #fff; border: none; padding: 14px 28px; border-radius: 6px; font-weight: 600; cursor: pointer; width: 100%; }
        button:hover { background: #1d4ed8; }
        footer { background: #0f172a; color: #94a3b8; text-align: center; padding: 30px; margin-top: 60px; }
    </style>
</head>
<body>
    <header>
        <a href="/" style="font-weight:700; text-decoration:none; color:#0f172a; font-size:20px;">Lean Construction <span style="color:#2563eb;">Advisory</span></a>
        <nav style="display:flex; gap:20px;">
            <a href="/" style="text-decoration:none; color:#475569;">Home</a>
            <a href="/services.html" style="text-decoration:none; color:#475569;">Services</a>
            <a href="/resume.html" style="text-decoration:none; color:#475569;">Consultant Resume</a>
            <a href="/contact.html" style="text-decoration:none; color:#2563eb; font-weight:bold;">Contact</a>
        </nav>
    </header>

    <div class="contact-box">
        <h1 style="margin-top:0; color:#0f172a;">Get in Touch</h1>
        <p style="color:#64748b; margin-bottom:30px;">Reach out for Lean Construction consulting, Last Planner implementation, or project controls advisory.</p>
        
        <form action="#" method="POST">
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" placeholder="Enter your name" required>
            </div>
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" placeholder="name@company.com" required>
            </div>
            <div class="form-group">
                <label>Company / Project</label>
                <input type="text" placeholder="Your organization">
            </div>
            <div class="form-group">
                <label>Message / Inquiry Details</label>
                <textarea rows="5" placeholder="Describe your project requirements..."></textarea>
            </div>
            <button type="submit">Submit Request</button>
        </form>
    </div>

    <footer>
        <p>&copy; 2026 Lean Construction Advisory Services.</p>
    </footer>
</body>
</html>
