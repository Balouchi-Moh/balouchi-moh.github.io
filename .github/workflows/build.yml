name: Build articles
on:
  push:
    branches: [main]
    paths:
      - 'content/**'
      - 'templates/**'
      - 'tools/build.py'
      - 'data/posts-legacy.json'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install markdown
      - run: python tools/build.py
      - name: Commit generated files
        run: |
          git config user.name "site-bot"
          git config user.email "site-bot@users.noreply.github.com"
          git add -A blog en/blog data/posts.json tools/generated.txt
          if git diff --cached --quiet; then echo "No changes"; else git commit -m "Build articles" && git push; fi
