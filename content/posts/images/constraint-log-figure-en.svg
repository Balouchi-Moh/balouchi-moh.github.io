<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 580" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <rect width="1200" height="580" fill="#ffffff"/>
  <text x="40" y="52" font-size="28" font-weight="700" fill="#1f2d3d">The Constraint Log: one line per constraint</text>
  <text x="40" y="82" font-size="16" fill="#5a6b7b">Illustrative example. An activity enters the weekly work plan only when its constraints are cleared.</text>

  <!-- header -->
  <rect x="40" y="110" width="1120" height="48" rx="6" fill="#1f3a5f"/>
  <g font-size="16" font-weight="700" fill="#ffffff">
    <text x="56" y="140">Activity</text>
    <text x="356" y="140">Constraint</text>
    <text x="686" y="140">Owner</text>
    <text x="876" y="140">Due</text>
    <text x="976" y="140">Status</text>
  </g>

  <!-- rows -->
  <g font-size="15" fill="#1f2d3d">
    <rect x="40" y="166" width="1120" height="64" fill="#f3f6fa"/>
    <text x="56" y="204">Pour L3 slab, zone B</text>
    <text x="356" y="204">Rebar shop drawings not approved</text>
    <text x="686" y="204">Design coordinator</text>
    <text x="876" y="204">Tue</text>
    <rect x="976" y="184" width="110" height="28" rx="14" fill="#fde8e8"/>
    <text x="1031" y="203" text-anchor="middle" font-weight="700" fill="#b42318">Open</text>

    <rect x="40" y="236" width="1120" height="64" fill="#ffffff"/>
    <text x="56" y="274">Install facade brackets</text>
    <text x="356" y="274">Crane slot not booked</text>
    <text x="686" y="274">Site manager</text>
    <text x="876" y="274">Wed</text>
    <rect x="976" y="254" width="110" height="28" rx="14" fill="#e3f6e8"/>
    <text x="1031" y="273" text-anchor="middle" font-weight="700" fill="#1a7f37">Cleared</text>

    <rect x="40" y="306" width="1120" height="64" fill="#f3f6fa"/>
    <text x="56" y="344">MEP first fix, L2</text>
    <text x="356" y="344">Wall sleeves missing</text>
    <text x="686" y="344">MEP foreman</text>
    <text x="876" y="344">Thu</text>
    <rect x="976" y="324" width="110" height="28" rx="14" fill="#fff3d6"/>
    <text x="1031" y="343" text-anchor="middle" font-weight="700" fill="#8a5a00">At risk</text>

    <rect x="40" y="376" width="1120" height="64" fill="#ffffff"/>
    <text x="56" y="414">Block work, L4</text>
    <text x="356" y="414">Delivery date unconfirmed</text>
    <text x="686" y="414">Procurement</text>
    <text x="876" y="414">Mon</text>
    <rect x="976" y="394" width="110" height="28" rx="14" fill="#fde8e8"/>
    <text x="1031" y="413" text-anchor="middle" font-weight="700" fill="#b42318">Open</text>
  </g>
  <rect x="40" y="110" width="1120" height="330" rx="6" fill="none" stroke="#c9d3de"/>

  <!-- flow -->
  <g font-size="15" font-weight="700" text-anchor="middle">
    <rect x="40" y="468" width="240" height="44" rx="8" fill="#eaf1fb" stroke="#1f3a5f"/>
    <text x="160" y="496" fill="#1f3a5f">Look-ahead: spot constraints</text>
    <rect x="480" y="468" width="240" height="44" rx="8" fill="#eaf1fb" stroke="#1f3a5f"/>
    <text x="600" y="496" fill="#1f3a5f">Owner clears by due date</text>
    <rect x="920" y="468" width="240" height="44" rx="8" fill="#eaf1fb" stroke="#1f3a5f"/>
    <text x="1040" y="496" fill="#1f3a5f">Ready: enters weekly plan</text>
  </g>
  <g stroke="#1f3a5f" stroke-width="2" fill="#1f3a5f">
    <line x1="284" y1="490" x2="470" y2="490"/><polygon points="480,490 468,484 468,496" stroke="none"/>
    <line x1="724" y1="490" x2="910" y2="490"/><polygon points="920,490 908,484 908,496" stroke="none"/>
  </g>

  <text x="40" y="552" font-size="13" fill="#5a6b7b">Own drawing. Concept: Last Planner System (Ballard); see also The Lean Builder, Donarumo &amp; Zandy, Lulu Publishing Services.</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
